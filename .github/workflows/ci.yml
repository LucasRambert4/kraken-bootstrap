name: CI

on:
  push:
    branches: [ main ]
    paths-ignore: ["docs/**"]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher le SHA
        run: 'echo "SHA: ${{ github.sha }}"'
      - uses: actions/checkout@v4
      - uses : actions/setup-python@v5
        with:
          python-version: '3.12'
      - run : pip install -r requirements-dev.txt
      - run : pytest -q