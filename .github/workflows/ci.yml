name: CI

on:
  push:
    branches: [ main ]
    paths-ignore: ["docs/**"]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher le SHA
        run: echo "SHA: ${{ github.sha }}"
      - uses: actions/checkout@v7
      - uses : actions/setup-node@v7
        with:
          node-version: '22'
      - run : npm ci
      - run : npm test